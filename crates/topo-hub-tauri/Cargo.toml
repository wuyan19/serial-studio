[package]
name = "topo-hub-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "topo-hub Tauri 桌面壳：进程内服务 + 窗口加载本机 URL（零 IPC）"

[[bin]]
name = "topo-hub-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
topo-hub = { path = "../topo-hub" }
ss-server = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tauri = { version = "2" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"
# 端口占用等启动失败的本地弹窗（无窗口可依赖时的兜底）
rfd = "0.15"
