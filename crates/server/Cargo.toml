[package]
name = "ss-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serial Studio 服务端：axum WS + REST 接入层（lib + headless bin）"

[lib]
name = "ss_server"
path = "src/lib.rs"

[[bin]]
name = "ss-server"
path = "src/main.rs"

[dependencies]
ss-core = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
dirs = "5"
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tokio-tungstenite = "0.21"
serialport = { workspace = true }
