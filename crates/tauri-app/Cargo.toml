[package]
name = "ss-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serial Studio Tauri 桌面壳"

[[bin]]
name = "serial-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ss-core = { workspace = true }
ss-server = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
# devtools 不在 release 启用：debug 构建由 Tauri 自动开启（cargo tauri dev 照常 F12），
# release 不带 F12，既省体积也避免线上可调试。
tauri = { version = "2", features = [] }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = "0.4"
bytes = "1"
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
