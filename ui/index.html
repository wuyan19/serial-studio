<!doctype html>
<html lang="zh" data-theme="linear" data-lum="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Serial Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { margin: 0; height: 100%; }
      html { background: #0a0b0d; color-scheme: dark; }
      /* 新增主题:在此加首帧背景色规则(防白闪),与 styles.css 的 token 覆盖块对应 */
      html[data-theme="linear-light"] { background: #f4f5f6; color-scheme: light; }
      html[data-theme="apple"] { background: #161617; }
      html[data-theme="apple-light"] { background: #f5f5f7; color-scheme: light; }
      html[data-theme="raycast"] { background: #07080a; }
      html[data-theme="raycast-light"] { background: #fafafa; color-scheme: light; }
      html[data-theme="superhuman"] { background: #0e0c1f; }
      html[data-theme="superhuman-light"] { background: #fafaf8; color-scheme: light; }
      html[data-theme="claude"] { background: #181715; }
      html[data-theme="claude-light"] { background: #f5f0e8; color-scheme: light; }
      html[data-theme="cursor"] { background: #fafaf7; color-scheme: light; }
      html[data-theme="stripe"] { background: #f6f9fc; color-scheme: light; }
      html[data-theme="sentry"] { background: #150f23; }
    </style>
    <script>
      // 首帧前定主题，避免闪烁。优先用户选择，否则跟随系统。
      // 主题 id 数组与 src/theme.ts 的 THEMES 注册表手动同步(内联脚本先于 bundle 执行,无法 import);
      // legacy 为已下线主题(dark/light → Linear 两态)的迁移表,与 theme.ts 保持一致。
      // lightIds 与 THEMES 各条的 lum="light" 同步——data-lum 驱动 styles.css 浅色家族共用层。
      (function () {
        var ids = [
          "linear", "linear-light",
          "apple", "apple-light",
          "raycast", "raycast-light",
          "superhuman", "superhuman-light",
          "claude", "claude-light",
          "cursor", "stripe", "sentry",
        ];
        var legacy = { dark: "linear", light: "linear-light" };
        var lightIds = {
          "linear-light": 1, "apple-light": 1, "raycast-light": 1,
          "superhuman-light": 1, "claude-light": 1, "cursor": 1, "stripe": 1,
        };
        function apply(t) {
          var root = document.documentElement;
          root.setAttribute("data-theme", t);
          root.setAttribute("data-lum", lightIds[t] ? "light" : "dark");
        }
        try {
          var s = localStorage.getItem("serial-studio-theme");
          var t;
          if (ids.indexOf(s) >= 0) t = s;
          else if (legacy[s]) {
            // 迁移命中即回写:旧 id 不留 localStorage,迁移表未来可退役
            t = legacy[s];
            try { localStorage.setItem("serial-studio-theme", t); } catch (e2) {}
          } else {
            t =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "linear-light"
                : "linear";
          }
          apply(t);
        } catch (e) {
          apply("linear");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
