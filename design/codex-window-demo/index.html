<!doctype html>
<html lang="zh-CN" data-theme="light" data-size="standard">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Serial Studio · 窗口设计预览</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23242424'/%3E%3Cpath d='m9 11 5 5-5 5m8 0h6' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="assets/xterm.css" />
    <script src="assets/xterm.js" defer></script>
    <script src="assets/addon-fit.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m9 0h5" /></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5m6-5v5M7 8h10v4a5 5 0 0 1-10 0V8Zm5 9v4" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4.5 4.5" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r=".9" /><circle cx="12" cy="12" r=".9" /><circle cx="19" cy="12" r=".9" /></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M9 4v16" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6m0-10v.1" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13A8.8 8.8 0 0 1 11 3.5 8.8 8.8 0 1 0 20.5 13Z" /></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 5h16M9 5V3h6v2M6 5l1 16h10l1-16M10 9v7m4-7v7" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z" /></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 3-8 11h6l-1 7 9-12h-7l1-6Z" /></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="m10 3-1 3-3 1-3 3 2 2-1 4 3 1 2 4 3-1 3 1 2-3 4-2-1-3 1-3-3-2-1-3-4 1-3-2Z" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m16 4 4 4-11 11-5 1 1-5L16 4Zm-2 2 4 4" /></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" /></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5" /></symbol>
    </svg>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="工作空间导航">
        <div class="sidebar-titlebar">
          <span class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="workspace-brand">
          <span class="brand-mark"><svg class="icon"><use href="#i-terminal" /></svg></span>
          <div><strong>Serial Studio</strong><span>我的工作空间</span></div>
          <span class="version-tag">预览</span>
        </div>
        <nav class="primary-nav" aria-label="功能导航">
          <button class="nav-item active" id="connections-nav" data-panel="connections" aria-current="page"><svg class="icon"><use href="#i-plug" /></svg><span>连接</span><span class="nav-count" id="connection-count">7</span></button>
          <button class="nav-item" id="macros-nav" data-panel="macros"><svg class="icon"><use href="#i-bolt" /></svg><span>宏</span><span class="nav-count" id="macro-count">4</span></button>
          <button class="nav-item" id="scripts-nav" data-panel="scripts"><svg class="icon"><use href="#i-code" /></svg><span>脚本</span><span class="nav-count" id="script-count">3</span></button>
        </nav>
        <div class="sidebar-actions">
          <button class="new-connection" id="new-connection"><svg class="icon"><use href="#i-plus" /></svg><span id="create-label">新建连接</span><kbd>⌘ N</kbd></button>
          <label class="search-field"><svg class="icon"><use href="#i-search" /></svg><input id="connection-search" type="search" placeholder="搜索连接…" aria-label="搜索列表" autocomplete="off" /><kbd>⌘ K</kbd></label>
        </div>
        <div class="groups-heading"><span id="list-heading">连接分组</span><div class="list-heading-actions"><span id="library-actions" hidden><button class="icon-button" id="library-import" title="导入" aria-label="导入库"><svg class="icon"><use href="#i-import" /></svg></button><button class="icon-button" id="library-export" title="导出" aria-label="导出库"><svg class="icon"><use href="#i-export" /></svg></button></span><button class="icon-button" id="new-group" title="新建分组" aria-label="新建分组"><svg class="icon"><use href="#i-plus" /></svg></button></div></div>
        <div class="connection-groups" id="connection-groups"></div>
        <div class="connection-groups library-list" id="library-list" hidden></div>
        <div class="sidebar-footer">
          <button class="utility-button" id="add-remote"><svg class="icon"><use href="#i-globe" /></svg><span>添加远程设备</span><svg class="icon utility-plus"><use href="#i-plus" /></svg></button>
          <div class="footer-actions"><button class="footer-setting" id="settings-open"><svg class="icon"><use href="#i-gear" /></svg>设置</button><span class="service-indicator" title="本地服务 127.0.0.1:18700"><span class="status-dot"></span>就绪</span><button class="icon-button" id="theme-toggle" aria-label="切换为深色主题" title="切换为深色主题"><svg class="icon"><use href="#i-moon" /></svg></button></div>
        </div>
      </aside>
      <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="关闭侧栏" hidden></button>

      <main class="main-workspace">
        <header class="workspace-header">
          <div class="header-leading"><button class="icon-button" id="sidebar-toggle" title="切换侧栏" aria-label="切换侧栏" aria-expanded="true"><svg class="icon"><use href="#i-panel" /></svg></button><span class="header-divider"></span><span class="header-title">终端工作区</span><span class="header-subtitle" id="session-count">3 个会话</span></div>
          <div class="header-actions"><button class="text-button connection-toggle" id="connection-toggle"><svg class="icon"><use href="#i-pause" /></svg><span>断开</span></button><button class="icon-button" id="clear-terminal" title="清空当前终端" aria-label="清空当前终端"><svg class="icon"><use href="#i-clear" /></svg></button><button class="icon-button" id="connection-info" title="连接信息" aria-label="连接信息"><svg class="icon"><use href="#i-info" /></svg></button><span class="header-divider"></span><button class="text-button" id="appearance-toggle" aria-expanded="false" aria-controls="appearance-panel"><svg class="icon"><use href="#i-settings" /></svg><span>外观</span></button></div>
        </header>
        <div class="tabs-row"><div class="session-tabs" id="session-tabs" role="tablist" aria-label="已打开的终端"></div><button class="icon-button tab-add" id="tab-add" aria-label="新建终端连接" title="新建终端连接"><svg class="icon"><use href="#i-plus" /></svg></button></div>
        <section class="session-content" id="session-panel" role="tabpanel" tabindex="-1">
          <div class="terminal-stage" id="terminal-stage" aria-label="串口与 SSH 终端"></div>
        </section>
        <section class="empty-state" id="empty-state" hidden><span class="empty-icon"><svg class="icon"><use href="#i-terminal" /></svg></span><h1>准备好开始调试了</h1><p>从左侧打开一个连接，或创建新的串口与 SSH 会话。</p><button class="primary-button" id="empty-connect"><svg class="icon"><use href="#i-plus" /></svg>新建连接</button></section>
        <footer class="statusbar"><span class="status-connection" id="status-connection"><span class="status-dot"></span>已连接</span><span class="status-type" id="status-type">串口</span><span class="status-address mono" id="status-address">/dev/ttyUSB0</span><span class="status-config" id="status-config">115200 · 8N1</span><span class="status-spacer"></span><span class="status-traffic" id="status-traffic">↓ 2.48 KB ↑ 128 B</span><span id="terminal-dimensions">80 × 24</span><span id="size-status">15px</span><span class="encoding-label">UTF-8</span><span class="demo-status" title="此设计原型使用本地模拟串口与 SSH 会话">演示</span></footer>
      </main>
    </div>

    <section class="appearance-panel" id="appearance-panel" aria-label="外观设置" hidden><div class="popover-heading"><h2>外观</h2><button class="icon-button" id="appearance-close" aria-label="关闭外观设置"><svg class="icon"><use href="#i-close" /></svg></button></div><div class="setting-label">主题<span>中性色调</span></div><div class="theme-options"><button class="theme-option" data-theme-choice="light" aria-pressed="true"><span class="theme-swatch swatch-light"><i></i><b></b><em></em></span><span><svg class="icon"><use href="#i-sun" /></svg>浅色</span><svg class="icon choice-check"><use href="#i-check" /></svg></button><button class="theme-option" data-theme-choice="dark" aria-pressed="false"><span class="theme-swatch swatch-dark"><i></i><b></b><em></em></span><span><svg class="icon"><use href="#i-moon" /></svg>深色</span><svg class="icon choice-check"><use href="#i-check" /></svg></button></div><div class="setting-label">界面与终端字号<span id="font-size-label">15 px</span></div><div class="segmented-control" aria-label="字号"><button data-size-choice="compact" aria-pressed="false">14<span>紧凑</span></button><button data-size-choice="standard" aria-pressed="true">15<span>标准</span></button><button data-size-choice="large" aria-pressed="false">16<span>舒适</span></button></div><div class="setting-label">窗口预览<span id="viewport-size"></span></div><div class="segmented-control window-control" aria-label="窗口预览尺寸"><button data-window-choice="fluid" aria-pressed="true">填满窗口</button><button data-window-choice="compact" aria-pressed="false">1100 × 760</button></div><p class="setting-note">字号、行高与控件同步调整。</p></section>
    <div class="context-menu" id="context-menu" role="menu" hidden></div>
    <dialog id="editor-dialog" class="editor-dialog"><form id="editor-form"><div class="dialog-heading"><h2 id="dialog-title">新建分组</h2><button class="icon-button" type="button" id="dialog-close" aria-label="关闭对话框"><svg class="icon"><use href="#i-close" /></svg></button></div><p class="dialog-description" id="dialog-description"></p><div id="dialog-fields"></div><div class="dialog-actions"><button type="button" class="text-button" id="dialog-cancel">取消</button><button class="primary-button" type="submit" id="dialog-submit">创建</button></div></form></dialog>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
