name: Release

# 标准 Tauri 发布流：tauri-apps/tauri-action 一条龙构建前端 + cargo tauri build +
# 打包（Win nsis / mac dmg / Linux appimage+deb）+ 自动建 release 并上传。
# 触发沿用 qrctrl 风格：推 v* tag 或 Actions 页手动 dispatch（填 tag）。
# 参考：https://github.com/tauri-apps/tauri-action
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles appimage" # deb 不支持自动更新 → 改 AppImage
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.args }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在线升级签名：检测到此环境变量 + createUpdaterArtifacts:true，
          # tauri-action 自动产出 .sig 并生成 latest.json 上传到 Release。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/tauri-app
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Serial Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Serial Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} — 草稿，发布前请人工核对产物。详见 README。"
          releaseDraft: true
          prerelease: false
          # Windows 同时打 nsis+msi：让 latest.json 确定性指向 nsis（体积小、更新体验好）
          updaterJsonPreferNsisLazyDownload: true
          args: ${{ matrix.args }}

      - name: Upload portable .exe (Windows · 非安装直运行)
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/serial-studio.exe target/release/serial-studio-portable-x64.exe
          gh release upload --clobber "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" target/release/serial-studio-portable-x64.exe

  # tauri-action 生成的 latest.json 有两类下载地址问题:
  # 1) updaterJsonPreferNsisLazyDownload 使 url 指向 api.github.com 资产端点——
  #    匿名限流(60 次/h/IP)返回 403 Forbidden,且国内直连 api.github.com 不通;
  # 2) 即便是 github.com/.../releases/download 直链,国内直连同样不稳。
  # 本 job 在全部矩阵完成、latest.json 汇齐后,把 url 统一改写为 ghproxy 镜像再覆盖上传。
  mirror-updater-urls:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite latest.json download URLs to ghproxy mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -e
          gh release download "$TAG" --pattern latest.json --output latest.json
          python3 - <<'PY'
          import json, subprocess, os
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          d = json.load(open("latest.json"))
          # asset id → 文件名(api 端点 url 无文件名,经 release 资产清单反查)
          out = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}", "--jq", '.assets[] | "\\(.id) \\(.name)"']
          ).decode()
          assets = dict(line.split(" ", 1) for line in out.splitlines())
          prefix = "https://ghproxy.net/https://github.com/"
          for k, v in d["platforms"].items():
              u = v["url"]
              if "/assets/" in u:  # api.github.com 资产端点 → 该 tag 的 releases/download 直链
                  aid = u.rsplit("/", 1)[-1]
                  if aid not in assets:
                      raise SystemExit(f"asset id {aid} 在 release 中无对应文件")
                  u = f"https://github.com/{repo}/releases/download/{tag}/{assets[aid]}"
              if not u.startswith("https://ghproxy.net/"):
                  v["url"] = "https://ghproxy.net/" + u
          json.dump(d, open("latest.json", "w"), indent=2, ensure_ascii=False)
          print("改写完成:", {k: v["url"].rsplit('/', 1)[-1] for k, v in d["platforms"].items()})
          PY
          gh release upload "$TAG" latest.json --clobber
