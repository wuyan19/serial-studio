name: Release

# 标准 Tauri 发布流：tauri-apps/tauri-action 一条龙构建前端 + cargo tauri build +
# 打包（Win nsis / mac dmg / Linux appimage+deb）+ 自动建 release 并上传。
# 触发沿用 qrctrl 风格：推 v* tag 或 Actions 页手动 dispatch（填 tag）。
# 参考：https://github.com/tauri-apps/tauri-action
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles appimage" # deb 不支持自动更新 → 改 AppImage
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.args }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在线升级签名：检测到此环境变量 + createUpdaterArtifacts:true，
          # tauri-action 自动产出 .sig 并生成 latest.json 上传到 Release。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/tauri-app
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Serial Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Serial Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} — 草稿，发布前请人工核对产物。详见 README。"
          releaseDraft: true
          prerelease: false
          # Windows 同时打 nsis+msi：让 latest.json 确定性指向 nsis（体积小、更新体验好）
          updaterJsonPreferNsisLazyDownload: true
          args: ${{ matrix.args }}

      - name: Upload portable .exe (Windows · 非安装直运行)
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/serial-studio.exe target/release/serial-studio-portable-x64.exe
          gh release upload --clobber "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" target/release/serial-studio-portable-x64.exe
